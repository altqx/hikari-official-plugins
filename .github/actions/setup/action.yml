name: Release tools
description: Python, LuaJIT, minisign, the hikari-plugins registry checks and HikariSub's manifest schema, at pinned versions.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - shell: bash
      run: sudo apt-get install -y --no-install-recommends luajit minisign
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: altqx/hikari-plugins
        ref: a5fa49a8ab6ed955ee8d3733a22d7a6399dd149c
        path: .registry
    - shell: bash
      run: |
        pip install -r .registry/requirements.txt
        curl -fsSL -o "$RUNNER_TEMP/hikari-plugin.schema.json" \
          https://raw.githubusercontent.com/altqx/hikari/f73e220599dfe521d4daead12cd3623886a98bda/docs/schemas/hikari-plugin.schema.json
        echo "HIKARI_PLUGIN_SCHEMA=$RUNNER_TEMP/hikari-plugin.schema.json" >> "$GITHUB_ENV"
        echo "PYTHONPATH=$GITHUB_WORKSPACE/.registry" >> "$GITHUB_ENV"
